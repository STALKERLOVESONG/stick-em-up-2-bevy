[package]
name = "sticks_game"
description = "Stick 'Em Up 2 reimplementation: the Bevy application."
version.workspace = true
edition.workspace = true
publish.workspace = true

# The program is SEU2.exe, as the original's (the library keeps the crate's name).
[[bin]]
name = "SEU2"
path = "src/main.rs"

[dependencies]
# `wav`: the Assault Rifle clips are WAV files (Vorbis is a default feature).
bevy = { version = "0.19", features = ["wav"] }
sticks_net = { path = "../sticks_net" }
sticks_p2p = { path = "../sticks_p2p" }
sticks_paper = { path = "../sticks_paper" }
sticks_sim = { path = "../sticks_sim" }
unity_compat = { path = "../unity_compat" }
unity_data = { path = "../unity_data" }

[build-dependencies]
exe_icon = { path = "../exe_icon" }
