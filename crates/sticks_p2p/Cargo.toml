[package]
name = "sticks_p2p"
description = "Stick 'Em Up 2 internet play: peer-to-peer connections (iroh: QUIC with hole punching, relayed when a direct path cannot be made)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Without the metrics; `tls-ring` and `portmapper` are what the default features add otherwise.
iroh = { version = "1.4", default-features = false, features = ["tls-ring", "portmapper"] }
sticks_net = { path = "../sticks_net" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
